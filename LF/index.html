<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>我爱范范</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				user-select: none;
				/* 避免选中文字，保持美观 */
			}

			body {
				min-height: 100vh;
				background: linear-gradient(145deg, #ff9a9e 0%, #fad0c4 50%, #fad0c4 100%);
				display: flex;
				justify-content: center;
				align-items: center;
				font-family: 'Segoe UI', '华文楷书', 'Microsoft YaHei', '楷体', 'Dancing Script', cursive, sans-serif;
				overflow-x: hidden;
				position: relative;
				padding: 20px;
			}

			canvas {
				position: absolute;
				left: 0;
				top: 0;
				width: 100%;
				height: 100%;
			}

			#child {
				position: fixed;
				width: 96%;
				top: 4%;
				z-index: 1;
			}

			/* 动态爱心canvas背景装饰 */
			.heart-canvas-container {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				pointer-events: none;
				z-index: -1;
			}


			/* 浮动爱心 & 花瓣特效 (纯CSS点缀) */
			.floating-heart {
				position: fixed;
				pointer-events: none;
				bottom: 0;
				font-size: 24px;
				opacity: 0;
				z-index: 15;
				animation: floatUp 3s ease-out forwards;
			}

			/* 动画定义 */
			@keyframes floatIn {
				0% {
					opacity: 0;
					transform: translateY(40px) scale(0.96);
				}

				100% {
					opacity: 1;
					transform: translateY(0) scale(1);
				}
			}

			@keyframes gentleBeat {

				0%,
				100% {
					transform: scale(1);
				}

				50% {
					transform: scale(1.12);
				}
			}

			@keyframes floatUp {
				0% {
					transform: translateY(0) rotate(0deg);
					opacity: 0.8;
				}

				100% {
					transform: translateY(-600px) rotate(20deg);
					opacity: 0;
				}
			}

			/* 响应式调整 */
			@media (max-width: 550px) {
				.love-card {
					padding: 20px 18px 35px;
				}

				.title {
					font-size: 2rem;
				}

				.poem p {
					font-size: 1rem;
				}

				.btn {
					font-size: 1rem;
					padding: 8px 22px;
				}

				.message-area {
					font-size: 1rem;
				}
			}


			/* 音频包装 */
			.audio-zone {
				display: block;
				background: #0f172ad9;
				border-radius: 2rem;
				padding: 0.9rem 1rem;
				margin: 20px 0 20px 0;
				box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
				border: 1px solid #334155;
			}

			/* 核心audio样式保证控件完整 且 autoplay 启用 */
			audio {
				width: 96%;
				height: 72px;
				min-height: 72px;
				margin: auto;
				display: block;
				border-radius: 15px;
				outline: none;
			}

			/* 音量/控件完全可见 */
			audio::-webkit-media-controls-panel {
				width: 100% !important;
			}

			audio::-webkit-media-controls-enclosure {
				overflow: visible !important;
			}
		</style>
	</head>
	<body>
		<div class="heart-canvas-container">
			<canvas id="heartCanvas"></canvas>
		</div>

		<div id="child" class="audio-zone">
			<audio id="myMusic" preload="auto" loop autoplay controls>
				<source src="http://www.szbuding.com/LF/music/我爱你不问归期-白小白.mp3" type="audio/mpeg">
			</audio>
		</div>


		<script>
			window.requestAnimationFrame =
				window.__requestAnimationFrame ||
				window.requestAnimationFrame ||
				window.webkitRequestAnimationFrame ||
				window.mozRequestAnimationFrame ||
				window.oRequestAnimationFrame ||
				window.msRequestAnimationFrame ||
				(function() {
					return function(callback, element) {
						var lastTime = element.__lastTime;
						if (lastTime === undefined) {
							lastTime = 0;
						}
						var currTime = Date.now();
						var timeToCall = Math.max(1, 33 - (currTime - lastTime));
						window.setTimeout(callback, timeToCall);
						element.__lastTime = currTime + timeToCall;
					};
				})();
			window.isDevice = (/android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(((navigator.userAgent ||
				navigator.vendor || window.opera)).toLowerCase()));
			var loaded = false;
			var init = function() {
				if (loaded) return;
				loaded = true;
				var mobile = window.isDevice;
				var koef = mobile ? 0.5 : 1;
				var canvas = document.getElementById('heartCanvas');
				var ctx = canvas.getContext('2d');
				var width = canvas.width = koef * innerWidth;
				var height = canvas.height = koef * innerHeight;
				var rand = Math.random;

				let particles = [];

				function fillStyleBackground() {
					var gradient = ctx.createLinearGradient(0, 0, width, height);
					gradient.addColorStop(0, "#ff9a9e");
					gradient.addColorStop(0.5, "#fad0c4");
					gradient.addColorStop(1, "#fad0c4");
					ctx.fillStyle = gradient;
					ctx.fillRect(0, 0, width, height);
				}

				function createFloatingHeart(type = '❤️') {
					const heartDiv = document.createElement('div');
					heartDiv.className = 'floating-heart';
					const heartsArr = ['❤️', '💖', '💗', '💓', '🌸', '🌹', '💘', '💝'];
					let symbol = type === 'random' ? heartsArr[Math.floor(Math.random() * heartsArr.length)] : type;
					heartDiv.innerHTML = symbol;
					heartDiv.style.left = Math.random() * (window.innerWidth - 40) + 'px';
					heartDiv.style.fontSize = (20 + Math.random() * 28) + 'px';
					heartDiv.style.opacity = 0.7 + Math.random() * 0.3;
					heartDiv.style.animationDuration = 2.5 + Math.random() * 2 + 's';
					document.body.appendChild(heartDiv);
					setTimeout(() => {
						heartDiv.remove();
					}, 3500);
				}

				function startHeartRain(count = 33) {
					for (let i = 0; i < count; i++) {
						setTimeout(() => {
							createFloatingHeart('random');
						}, i * 70);
					}
					const heartsArr = ['❤️', '💖', '💗', '💓', '🌸', '🌹', '💘', '💝'];
					let symbol = heartsArr[Math.floor(Math.random() * heartsArr.length)];
					createFloatingHeart(symbol + "我爱范范" + symbol);
				}

				function createRandomParticle() {
					let x = Math.random() * width;
					let y = Math.random() * height;
					let size = 18 + Math.random() * 22;
					let speedX = (Math.random() - 0.5) * 0.6;
					let speedY = 0.3 + Math.random() * 0.9;
					let opacity = 0.2 + Math.random() * 0.5;
					particles.push(new HeartParticle(x, y, size, speedX, speedY, opacity));
				}

				function initParticles() {
					particles = [];
					const particleCount = Math.min(80, Math.floor(width / 20));
					for (let i = 0; i < particleCount; i++) {
						createRandomParticle();
					}
				}

				class HeartParticle {
					constructor(x, y, size, speedX, speedY, opacity) {
						this.x = x;
						this.y = y;
						this.size = size;
						this.speedX = speedX;
						this.speedY = speedY;
						this.opacity = opacity;
						this.color = `hsla(${Math.random() * 20 + 340}, 80%, 65%, ${opacity})`;
					}
					update() {
						this.x += this.speedX;
						this.y += this.speedY;
						if (this.y > height + 20 || this.x < -30 || this.x > width + 30) {
							return false;
						}
						if (this.opacity > 0.03) this.opacity -= 0.002;
						return true;
					}
					draw(ctx) {
						ctx.save();
						ctx.globalAlpha = this.opacity;
						ctx.font = `${this.size}px "Segoe UI Emoji"`;
						ctx.fillStyle = this.color;
						ctx.fillText("❤️", this.x, this.y);
						ctx.restore();
					}
				}

				var heartPosition = function(rad) {
					//return [Math.sin(rad), Math.cos(rad)];
					return [Math.pow(Math.sin(rad), 3), -(15 * Math.cos(rad) - 5 * Math.cos(2 * rad) - 2 * Math.cos(3 *
						rad) - Math.cos(4 * rad))];
				};
				var scaleAndTranslate = function(pos, sx, sy, dx, dy) {
					return [dx + pos[0] * sx, dy + pos[1] * sy];
				};

				window.addEventListener('resize', function() {
					width = canvas.width = koef * innerWidth;
					height = canvas.height = koef * innerHeight;
					fillStyleBackground();
				});

				var traceCount = mobile ? 20 : 50;
				var pointsOrigin = [];
				var i;
				var dr = mobile ? 0.3 : 0.1;
				for (i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), 210, 13, 0, 0));
				for (i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), 150, 9, 0, 0));
				for (i = 0; i < Math.PI * 2; i += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(i), 90, 5, 0, 0));
				var heartPointsCount = pointsOrigin.length;

				var targetPoints = [];
				var pulse = function(kx, ky) {
					for (i = 0; i < pointsOrigin.length; i++) {
						targetPoints[i] = [];
						targetPoints[i][0] = kx * pointsOrigin[i][0] + width / 2;
						targetPoints[i][1] = ky * pointsOrigin[i][1] + height / 2 - 80;
					}
				};

				var e = [];
				for (i = 0; i < heartPointsCount; i++) {
					var x = rand() * width;
					var y = rand() * height;
					e[i] = {
						vx: 0,
						vy: 0,
						R: 2,
						speed: rand() + 5,
						q: ~~(rand() * heartPointsCount),
						D: 2 * (i % 2) - 1,
						force: 0.2 * rand() + 0.7,
						f: "hsla(0," + ~~(40 * rand() + 60) + "%," + ~~(60 * rand() + 20) + "%,.3)",
						trace: []
					};
					for (var k = 0; k < traceCount; k++) e[i].trace[k] = {
						x: x,
						y: y
					};
				}

				var config = {
					traceK: 0.4,
					timeDelta: 0.01
				};

				var time = 0;
				var loop = function() {
					var n = -Math.cos(time);
					pulse((1 + n) * .5, (1 + n) * .5);
					time += ((Math.sin(time)) < 0 ? 9 : (n > 0.8) ? .2 : 1) * config.timeDelta;
					fillStyleBackground();
					
					for (i = e.length; i--;) {
						var u = e[i];
						var q = targetPoints[u.q];
						var dx = u.trace[0].x - q[0];
						var dy = u.trace[0].y - q[1];
						var length = Math.sqrt(dx * dx + dy * dy);
						if (10 > length) {
							if (0.95 < rand()) {
								u.q = ~~(rand() * heartPointsCount);
							} else {
								if (0.99 < rand()) {
									u.D *= -1;
								}
								u.q += u.D;
								u.q %= heartPointsCount;
								if (0 > u.q) {
									u.q += heartPointsCount;
								}
							}
						}
						u.vx += -dx / length * u.speed;
						u.vy += -dy / length * u.speed;
						u.trace[0].x += u.vx;
						u.trace[0].y += u.vy;
						u.vx *= u.force;
						u.vy *= u.force;
						for (k = 0; k < u.trace.length - 1;) {
							var T = u.trace[k];
							var N = u.trace[++k];
							N.x -= config.traceK * (N.x - T.x);
							N.y -= config.traceK * (N.y - T.y);
						}
						ctx.fillStyle = u.f;
						for (k = 0; k < u.trace.length; k++) {
							ctx.fillRect(u.trace[k].x, u.trace[k].y, 2, 2);
						}
					}
					ctx.fillStyle = "rgba(255,255,255,1)";
					for (i = u.trace.length + 16; i--;) ctx.fillRect(targetPoints[i][0], targetPoints[i][1], 2, 2);
					
					
					for (let i = 0; i < particles.length; i++) {
						let keep = particles[i].update();
						particles[i].draw(ctx);
						if (!keep) {
							particles.splice(i, 1);
							i--;
							// 增加新的粒子保持数量
							createRandomParticle();
						}
					}
					// 维持粒子总数
					while (particles.length < 33) {
						createRandomParticle();
					}

					window.requestAnimationFrame(loop, canvas);
				};
				initParticles();
				loop();

				document.body.addEventListener('touchstart', (e) => {
					startHeartRain();
				});

				const myMusic = document.getElementById('myMusic');
				let musicPlaying = false;
				myMusic.play().then(() => {
					musicPlaying = true;
				}).catch((e) => {
					musicPlaying = false;
				});

			};

			var s = document.readyState;
			if (s === 'complete' || s === 'loaded' || s === 'interactive') init();
			else document.addEventListener('DOMContentLoaded', init, false);
		</script>
	</body>
</html>
